<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Castle County Oracle</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">New Castle County, Delaware</p>
      <h1>Property intelligence</h1>
    </div>
    <p id="status">Loading the published dataset.</p>
  </header>
  <nav>
    <button type="button" data-panel="summary" class="active">Run</button>
    <button type="button" data-panel="search">Radius</button>
    <button type="button" data-panel="permits">Open roof permits</button>
    <button type="button" data-panel="ask">Ask</button>
  </nav>
  <main>
    <section id="summary"></section>
    <section id="search" hidden>
      <form id="search-form">
        <label>Latitude <input id="lat" type="number" step="0.000001" value="39.739072"></label>
        <label>Longitude <input id="lon" type="number" step="0.000001" value="-75.539787"></label>
        <label>Radius miles <input id="miles" type="number" min="0.1" max="30" step="0.1" value="5"></label>
        <label>Min roof age <input id="min-age" type="number" min="0" value="15"></label>
        <label class="check"><input id="open-only" type="checkbox"> Open roof permits only</label>
        <button type="submit">Search</button>
      </form>
      <div id="map"></div>
      <p id="search-count"></p>
      <div id="search-results"></div>
    </section>
    <section id="permits" hidden></section>
    <section id="ask" hidden>
      <form id="ask-form">
        <textarea id="question" rows="3">Which properties within five miles of Wilmington have roofs older than 15 years?</textarea>
        <button type="submit">Answer</button>
      </form>
      <div id="answer"></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
